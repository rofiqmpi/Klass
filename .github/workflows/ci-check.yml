name: Android compile check

# Runs on every non-master branch and pull request. Never publishes anything.
on:
  push:
    branches-ignore:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run shared module tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain :shared:testAndroidHostTest 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          msg="$(grep -E '^e: |What went wrong|FAILED' -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Android build errors::${msg:0:60000}"
