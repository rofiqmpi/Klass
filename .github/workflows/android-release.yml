name: Android APKs and GitHub Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Validate secrets and resolve the next version number
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Validate secrets and resolve version
        id: version
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Configure the GOOGLE_SERVICES_JSON repository secret before building release APKs."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the ANDROID_KEYSTORE_BASE64 repository secret before building release APKs."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            target_repo="${PUBLIC_RELEASE_REPO:-rofiqmpi/Klass-Releases}"
            api_url="https://api.github.com/repos/${target_repo}/releases/latest"
            latest_version="1.0.0"
            if [ -n "${PUBLIC_RELEASE_TOKEN:-}" ]; then
              response=$(curl -fsS -H "Authorization: token ${PUBLIC_RELEASE_TOKEN}" "$api_url" 2>/dev/null || true)
            else
              response=$(curl -fsS "$api_url" 2>/dev/null || true)
            fi
            tag_name=$(echo "$response" | grep -o '"tag_name": *"[^"]*"' | head -n 1 | cut -d'"' -f4 || echo "")
            if [ -n "$tag_name" ]; then
              latest_version="${tag_name#v}"
            fi
            IFS='.' read -r major minor patch <<< "$latest_version"
            major="${major:-1}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            next_patch=$((patch + 1))
            if [ "$next_patch" -le "$GITHUB_RUN_NUMBER" ]; then
              next_patch="$GITHUB_RUN_NUMBER"
            fi
            version="${major}.${minor}.${next_patch}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the MAJOR.MINOR.PATCH format."
            exit 1
          fi
          IFS='.' read -r v_major v_minor v_patch <<< "$version"
          calc_code=$((v_major * 10000 + v_minor * 100 + v_patch))
          if [ "$calc_code" -lt "$GITHUB_RUN_NUMBER" ]; then
            calc_code="$GITHUB_RUN_NUMBER"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$calc_code" >> "$GITHUB_OUTPUT"
          echo "### Klass v${version} (code ${calc_code})" >> "$GITHUB_STEP_SUMMARY"

  # 2. Unit tests (informational: a failure here does not block the release)
  test:
    name: Unit tests
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared module tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:testAndroidHostTest

  # 3a. Debug APK
  build-debug:
    name: Build debug APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write build configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          APP_UPDATE_URL: ${{ secrets.APP_UPDATE_URL }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
        run: |
          set -euo pipefail
          target_repo="${PUBLIC_RELEASE_REPO:-rofiqmpi/Klass-Releases}"
          resolved_update_url="${APP_UPDATE_URL:-https://api.github.com/repos/${target_repo}/releases/latest}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          : > .env
          [ -n "${GEMINI_API_KEY:-}" ] && printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          [ -n "${RECAPTCHA_SITE_KEY:-}" ] && printf 'RECAPTCHA_SITE_KEY=%s\n' "$RECAPTCHA_SITE_KEY" >> .env
          [ -n "${FIRESTORE_DATABASE_ID:-}" ] && printf 'FIRESTORE_DATABASE_ID=%s\n' "$FIRESTORE_DATABASE_ID" >> .env
          [ -n "$resolved_update_url" ] && printf 'APP_UPDATE_URL=%s\n' "$resolved_update_url" >> .env
          true
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PVERSION_NAME="${{ needs.prepare.outputs.version }}" \
            -PVERSION_CODE="${{ needs.prepare.outputs.code }}"
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Klass-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: klass-debug-apk
          path: Klass-debug.apk
          if-no-files-found: error

  # 3b. Signed release APK
  build-release:
    name: Build signed release APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write build configuration and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          APP_UPDATE_URL: ${{ secrets.APP_UPDATE_URL }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
        run: |
          set -euo pipefail
          target_repo="${PUBLIC_RELEASE_REPO:-rofiqmpi/Klass-Releases}"
          resolved_update_url="${APP_UPDATE_URL:-https://api.github.com/repos/${target_repo}/releases/latest}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klass-release.jks"
          : > .env
          [ -n "${GEMINI_API_KEY:-}" ] && printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          [ -n "${RECAPTCHA_SITE_KEY:-}" ] && printf 'RECAPTCHA_SITE_KEY=%s\n' "$RECAPTCHA_SITE_KEY" >> .env
          [ -n "${FIRESTORE_DATABASE_ID:-}" ] && printf 'FIRESTORE_DATABASE_ID=%s\n' "$FIRESTORE_DATABASE_ID" >> .env
          [ -n "$resolved_update_url" ] && printf 'APP_UPDATE_URL=%s\n' "$resolved_update_url" >> .env
          true
      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/klass-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PVERSION_NAME="${{ needs.prepare.outputs.version }}" \
            -PVERSION_CODE="${{ needs.prepare.outputs.code }}"
      - name: Verify signature
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk Klass-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: klass-release-apk
          path: Klass-release.apk
          if-no-files-found: error

  # 4. Publish the verified release APK and update the in-app update config
  publish:
    name: Publish release
    needs: [prepare, build-debug, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: klass-release-apk
          path: dist

      - name: Publish release APK (public release channel)
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v${version}"
          target_repo="${PUBLIC_RELEASE_REPO:-rofiqmpi/Klass-Releases}"
          if [ -n "${PUBLIC_RELEASE_REPO:-}" ] && [ -n "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            export GH_TOKEN="$PUBLIC_RELEASE_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          apk_url="https://github.com/${target_repo}/releases/download/${tag}/Klass-release.apk"
          printf '{\n  "version": "%s",\n  "tag_name": "%s",\n  "apk_url": "%s",\n  "notes": "Klass %s release update"\n}\n' \
            "$version" "$tag" "$apk_url" "$tag" > update.json
          if gh release view "${tag}" --repo "${target_repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              dist/Klass-release.apk \
              update.json \
              --repo "${target_repo}" \
              --clobber
          else
            create_args=(
              "${tag}"
              dist/Klass-release.apk
              update.json
              --repo "${target_repo}"
              --title "Klass ${tag}"
              --notes "Klass ${tag} release update"
            )
            if [ "${target_repo}" = "${GITHUB_REPOSITORY}" ]; then
              create_args+=(--target "$GITHUB_SHA" --generate-notes)
            fi
            gh release create "${create_args[@]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          echo "Published ${tag}: ${apk_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync Firestore app_update config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APK_URL: ${{ steps.release.outputs.apk_url }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not configured. Skipping Firestore config sync."
            exit 0
          fi
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          node << 'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          async function main() {
            const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const googleServices = JSON.parse(fs.readFileSync('app/google-services.json', 'utf8'));
            const projectId = sa.project_id || googleServices.project_info.project_id;
            const dbId = (process.env.FIRESTORE_DATABASE_ID || '').trim() || 'ai-studio-android-klass-8e28a555-75a6-4902-af9c-0b216450601b';
            const nowSec = Math.floor(Date.now() / 1000);
            const header = Buffer.from(JSON.stringify({ alg: 'RS256', typ: 'JWT' })).toString('base64url');
            const claim = Buffer.from(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/datastore',
              aud: 'https://oauth2.googleapis.com/token',
              iat: nowSec,
              exp: nowSec + 3600,
            })).toString('base64url');
            const signer = crypto.createSign('RSA-SHA256');
            signer.update(`${header}.${claim}`);
            const signature = signer.sign(sa.private_key).toString('base64url');
            const jwt = `${header}.${claim}.${signature}`;
            const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt,
              }),
            });
            if (!tokenRes.ok) throw new Error(`OAuth token error: ${tokenRes.status} ${await tokenRes.text()}`);
            const { access_token } = await tokenRes.json();
            const docUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/${encodeURIComponent(dbId)}/documents/config/app_update`;
            const body = {
              fields: {
                enabled: { booleanValue: true },
                latest_version: { stringValue: process.env.RELEASE_VERSION },
                version: { stringValue: process.env.RELEASE_VERSION },
                apk_url: { stringValue: process.env.RELEASE_APK_URL },
                notes: { stringValue: `Klass v${process.env.RELEASE_VERSION} release update` },
                force: { booleanValue: false },
                updated_at: { integerValue: String(Date.now()) },
              },
            };
            const patchRes = await fetch(docUrl, {
              method: 'PATCH',
              headers: {
                'Authorization': `Bearer ${access_token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            if (!patchRes.ok) throw new Error(`Firestore PATCH failed: ${patchRes.status} ${await patchRes.text()}`);
            console.log(`Synced config/app_update to v${process.env.RELEASE_VERSION} -> ${process.env.RELEASE_APK_URL}`);
          }
          main().catch((e) => { console.error(e); process.exit(1); });
          EOF
